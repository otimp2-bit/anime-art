      <stop offset="30%" stop-color="#1f74b8"/>
      <stop offset="62%" stop-color="#57c8f2"/>
      <stop offset="88%" stop-color="#ccf4ff"/>
      <stop offset="100%" stop-color="#eafdff"/>
