    <linearGradient id="hatG" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2a2740"/>
      <stop offset="55%" stop-color="#141225"/>
      <stop offset="100%" stop-color="#08060f"/>
