      <stop offset="35%" stop-color="#152a55"/>
      <stop offset="65%" stop-color="#1d2352"/>
      <stop offset="100%" stop-color="#0a0a1c"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="55%">
