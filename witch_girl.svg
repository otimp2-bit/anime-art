    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241f33"/>
      <stop offset="60%" stop-color="#12101d"/>
      <stop offset="100%" stop-color="#07060d"/>
